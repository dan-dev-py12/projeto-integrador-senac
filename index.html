<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>São João Alimentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div id="titulo">
                <h1>São João Alimentos</h1>
            </div>
        </header>
 
        <main>
            <!-- ============ FORMULÁRIO ============ -->
            <form id="ccliente" autocomplete="off">
                <h1 id="titulo-form">Cadastrar<br>Novo Cliente</h1>
 
                <label for="nome">Nome</label>
                <input class="campo" type="text" id="nome" required>
 
                <label for="email">E-mail</label>
                <input class="campo" type="email" id="email">
 
                <label for="telefone">Telefone</label>
                <input class="campo" type="tel" id="telefone">
 
                <label for="endereco">Endereço</label>
                <input class="campo" type="text" id="endereco">
 
                <label for="nascimento">Data de nascimento</label>
                <input class="campo" type="date" id="nascimento">
 
                <button type="submit" id="salvar">Salvar Cadastro</button>
                <button type="button" id="cancelar" hidden>Cancelar edição</button>
            </form>
 
            <!-- ============ LISTA DE CLIENTES ============ -->
            <div id="tabela">
                <div id="cabecalho">
                    <h6>Meus Clientes</h6>
                    <section id="pesquisa">
                        <input type="text" id="filtro" placeholder="Filtrar por nome...">
                    </section>
                </div>
 
                <div id="conteudo">
                    <table>
                        <thead>
                            <tr class="titulos">
                                <th>ID</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <!-- As linhas são criadas pelo script.js -->
                        <tbody id="lista-clientes"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
 
    <script src="script.js"></script>
</body>
</html>
